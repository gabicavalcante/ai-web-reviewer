<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #F4F6FA;
    --surface: #FFFFFF;
    --surface-2: #EDF1F7;
    --ink: #141C28;
    --ink-soft: #5C6B80;
    --ink-faint: #8794A6;
    --line: #D7DEE8;
    --line-soft: #E6EBF2;
    --accent: #1F4B99;
    --accent-ink: #12315F;
    --accent-soft: #E4EBF7;
    --on-accent: #FFFFFF;
    --add: #1B6E42;
    --add-bg: #E6F3EB;
    --add-gutter: #CBE6D6;
    --del: #A81F2A;
    --del-bg: #FBEAEB;
    --del-gutter: #F2CFD2;
    --shadow: 0 1px 2px rgba(20, 28, 40, .06), 0 8px 24px -16px rgba(20, 28, 40, .18);
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, Segoe UI, sans-serif;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0E131A;
      --surface: #151C25;
      --surface-2: #1D2632;
      --ink: #E3EAF3;
      --ink-soft: #8B9BB0;
      --ink-faint: #6B7B90;
      --line: #28323F;
      --line-soft: #1F2833;
      --accent: #84AAFF;
      --accent-ink: #B9CEFF;
      --accent-soft: #1A2740;
      --on-accent: #0E131A;
      --add: #5FD08C;
      --add-bg: #12271C;
      --add-gutter: #1D4531;
      --del: #F0868F;
      --del-bg: #2B1417;
      --del-gutter: #4A2126;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .7);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0E131A;
    --surface: #151C25;
    --surface-2: #1D2632;
    --ink: #E3EAF3;
    --ink-soft: #8B9BB0;
    --ink-faint: #6B7B90;
    --line: #28323F;
    --line-soft: #1F2833;
    --accent: #84AAFF;
    --accent-ink: #B9CEFF;
    --accent-soft: #1A2740;
    --on-accent: #0E131A;
    --add: #5FD08C;
    --add-bg: #12271C;
    --add-gutter: #1D4531;
    --del: #F0868F;
    --del-bg: #2B1417;
    --del-gutter: #4A2126;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .7);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .shell { max-width: 1320px; margin: 0 auto; padding: 32px 24px 72px; }
  .stale { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 12px; margin: 0 0 20px; padding: 9px 14px; border: 1px solid var(--accent); border-radius: 3px; background: var(--accent-soft); font-family: var(--sans); font-size: 13px; color: var(--ink); }
  .stale .btn { margin-left: auto; flex: none; }
  /* The end of a review, not a step in it: shown only once every commit is ticked. */
  .stale.squash { border-color: var(--add); background: var(--add-bg); }

  /* ---------- header ---------- */
  .masthead { display: flex; flex-direction: column; gap: 14px; padding-bottom: 26px; border-bottom: 1px solid var(--line); }
  .eyebrow { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); }
  .eyebrow .branch { color: var(--accent); }
  .eyebrow .sep { color: var(--line); }
  h1 { font-family: var(--serif); font-size: clamp(30px, 4.4vw, 44px); font-weight: 600; line-height: 1.08; letter-spacing: -.015em; margin: 0; text-wrap: balance; }
  .dek { max-width: 62ch; color: var(--ink-soft); font-size: 16.5px; margin: 0; }
  .figures { display: flex; flex-wrap: wrap; gap: 0; margin-top: 6px; }
  .figure { padding: 0 22px 0 0; margin-right: 22px; border-right: 1px solid var(--line); }
  .figure:last-child { border-right: 0; margin-right: 0; padding-right: 0; }
  .figure .v { font-family: var(--mono); font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; display: block; }
  .figure .k { font-size: 12px; color: var(--ink-faint); letter-spacing: .02em; }

  /* The pair reads as a diff: the struck value is the old side, the standing one is the
     current side, in the same two colours the diff uses further down. Colouring only the
     struck half made red a verdict on the direction; colouring both makes it a substitution,
     so which way the number moved stops mattering. */
  .figure .was { color: var(--del); text-decoration: line-through; font-weight: 400; }
  .figure .now { color: var(--add); }

  /* ---------- flow strip ---------- */
  .flow { margin: 30px 0 34px; }
  .flow h2, .rail h2, .openq h2, .orphans h2 { font-family: var(--mono); font-size: 11.5px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 12px; }
  .stages { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding-bottom: 4px; }
  .stage { flex: 1 1 0; min-width: 148px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-right-width: 0; display: flex; flex-direction: column; gap: 7px; }
  .stage:first-child { border-radius: 3px 0 0 3px; }
  .stage:last-child { border-right-width: 1px; border-radius: 0 3px 3px 0; }
  .stage .where { font-family: var(--mono); font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-faint); }
  .stage .what { font-size: 14px; font-weight: 500; line-height: 1.3; }
  .stage .marks { display: flex; gap: 4px; margin-top: auto; }
  .mark { font-family: var(--mono); font-size: 11px; font-weight: 500; width: 19px; height: 19px; display: grid; place-items: center; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); }
  .mark.none { background: var(--surface-2); color: var(--ink-faint); }

  /* ---------- layout ---------- */
  .board { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 28px; align-items: start; margin-top: 24px; }
  /* The panel takes its own column, so opening a thread narrows the diff instead of
     covering it. Sticky with its own scrollbar: a long thread scrolls inside the panel
     while the anchored line stays where it was. */
  body.side-threads.side-open .board { grid-template-columns: 340px minmax(0, 1fr) minmax(400px, 480px); }
  /* The panel needs a column of its own. Capped at 1320px it took that column out of the
     diff, which then clipped mid-line. Open, the page uses the window instead. */
  body.side-threads.side-open .shell { max-width: none; }
  .side { position: sticky; top: 20px; max-height: calc(100vh - 40px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; box-shadow: var(--shadow); overflow: hidden; }
  .side-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 11px; color: var(--ink-faint); flex: none; }
  .side-anchor { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-close { margin-left: auto; flex: none; }
  .side-code { flex: none; padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); font-family: var(--mono); font-size: 12px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-soft); }
  .side-body { overflow-y: auto; overscroll-behavior: contain; }
  .side-body .thread, .side-body .resolved-thread { margin: 0 14px; }
  .side-body .turn { grid-template-columns: minmax(0, 1fr); gap: 1px; }
  .side-body .turn .who { margin-top: 2px; }
  .side-body .reply, .side-body .turn .said { max-width: none; }
  table.diff tr.side-open-row td { background: var(--accent-soft); }
  /* Below this width a third column would squeeze the diff past reading, so the panel
     floats instead. It covers the code, which is the thing this layout exists to avoid,
     so the inline mode is the better choice on a narrow screen. */
  /* Three columns stop fitting before the panel does. The commit list is the one you are
     not reading while a thread is open, so it gives up its column first and comes back on
     Close. */
  @media (max-width: 1660px) {
    body.side-threads.side-open .board { grid-template-columns: minmax(0, 1fr) minmax(380px, 460px); }
    body.side-threads.side-open .rail { display: none; }
  }
  /* Narrower than this the diff itself stops being readable beside a panel, so the panel
     floats. It covers the code, which is what this layout exists to avoid, so the inline
     toggle is the better choice at this width. */
  @media (max-width: 1080px) {
    body.side-threads.side-open .board { grid-template-columns: minmax(0, 1fr); }
    .side { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 92vw); max-height: none; border-radius: 0; z-index: 30; }
  }
  @media (max-width: 940px) { .board { grid-template-columns: 1fr; } }

  /* The rail is taller than the screen on a long branch, so sticky alone does nothing:
     reaching commit 20 scrolls the page, and the pane goes with it. The column is held
     to the viewport and the list scrolls inside it, so the diff stays beside the commit
     that produced it. */
  .rail { position: sticky; top: 20px; display: flex; flex-direction: column; max-height: calc(100vh - 40px); }
  @media (max-width: 940px) { .rail { position: static; max-height: none; } }
  .commits { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 0; padding-right: 4px; }
  @media (max-width: 940px) { .commits { overflow-y: visible; } }
  .commit-btn { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; text-align: left; padding: 13px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; color: inherit; font: inherit; cursor: pointer; transition: border-color .12s, background .12s; }
  .commit-btn:hover { border-color: var(--accent); }
  .commit-btn[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .commit-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cb-num { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--ink-faint); padding-top: 2px; font-variant-numeric: tabular-nums; }
  .commit-btn[aria-current="true"] .cb-num { color: var(--accent-ink); }
  .cb-body { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .cb-head { font-size: 14px; font-weight: 500; line-height: 1.32; }
  .cb-headrow { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .cb-meta { display: flex; align-items: center; gap: 9px; font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
  .cb-meta .plus { color: var(--add); }
  .cb-meta .minus { color: var(--del); }
  .cb-meta .done { color: var(--accent); }
  .cb-tag { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 1px 5px; border-radius: 2px; border: 1px solid currentColor; }
  .cb-tag.start { color: var(--accent); }
  .cb-tag.care { color: var(--del); }
  .cb-tag.skim { color: var(--ink-faint); }
  .cb-why { font-size: 12px; line-height: 1.35; color: var(--ink-faint); }
  .commit-btn.is-skim .cb-head { color: var(--ink-soft); font-weight: 400; }
  .bar { display: flex; height: 3px; width: 46px; border-radius: 2px; overflow: hidden; background: var(--line-soft); }
  .bar i { display: block; height: 100%; }
  .bar .a { background: var(--add); }
  .bar .d { background: var(--del); }
  .progress { margin-top: 14px; font-family: var(--mono); font-size: 11px; color: var(--ink-faint); display: flex; align-items: center; gap: 8px; }
  .progress .track { flex: 1; height: 3px; background: var(--line-soft); border-radius: 2px; overflow: hidden; }
  .progress .track i { display: block; height: 100%; background: var(--accent); transition: width .18s; }

  /* ---------- detail ---------- */
  .pane { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; box-shadow: var(--shadow); overflow: hidden; }
  .pane-head { padding: 24px 26px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
  .kindrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .kind { font-family: var(--mono); font-size: 11px; letter-spacing: .05em; padding: 3px 8px; border-radius: 2px; background: var(--accent-soft); color: var(--accent-ink); }
  .sha { font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); }
  .stagetag { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-faint); margin-left: auto; }
  .pane-head h3 { font-family: var(--serif); font-size: clamp(21px, 2.6vw, 27px); font-weight: 600; line-height: 1.18; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
  .why { margin: 0; color: var(--ink-soft); max-width: 68ch; }
  .points { margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; max-width: 72ch; }
  .points li { position: relative; padding-left: 18px; font-size: 14.5px; }
  .points li::before { content: ""; position: absolute; left: 0; top: .62em; width: 7px; height: 1px; background: var(--accent); }
  .points code, .why code, .openq code { font-family: var(--mono); font-size: .88em; background: var(--surface-2); padding: 1px 5px; border-radius: 2px; }

  /* verified matrix */
  .verified { padding: 22px 26px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
  .verified h4 { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 12px; }
  .vwrap { overflow-x: auto; }
  table.matrix { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  table.matrix th { text-align: left; font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); padding: 0 12px 8px 0; border-bottom: 1px solid var(--line); }
  table.matrix td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line-soft); vertical-align: baseline; }
  table.matrix tr:last-child td { border-bottom: 0; }
  table.matrix .num { font-family: var(--mono); font-variant-numeric: tabular-nums; width: 1%; white-space: nowrap; }
  .ok { color: var(--add); font-family: var(--mono); font-size: 12px; white-space: nowrap; }

  /* ---------- diff ---------- */
  /* A follow-up is a fixup that git will squash into the commit above it. It is drawn
     inside its target rather than beside it, so a review is as long as the change is. */
  /* A fixup is a separate commit that amends the one above it, and a hairline between
     the two diffs was not enough to say so: the pane read as one commit. The block is
     inset behind its own bar and on its own ground, so the break is visible before any
     of the words are. */
  .followup { margin: 20px 0 0; border-top: 1px solid var(--line); border-left: 3px solid var(--accent); background: var(--ground); }
  .followup-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; padding: 13px 22px 5px; font-family: var(--sans); }
  .followup-head .tag { font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); flex: none; }
  .followup-head .sha { font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); flex: none; }
  .followup-head .sub { font-size: 13px; color: var(--ink); }
  .followup-head .stat { margin-left: auto; flex: none; font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
  .followup-note { padding: 0 22px 12px; font-family: var(--sans); font-size: 12px; line-height: 1.5; color: var(--ink-soft); }
  .followup .file:last-child { border-bottom: none; }
  .difftools { display: flex; align-items: center; gap: 14px; padding: 12px 26px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 11px; color: var(--ink-faint); letter-spacing: .05em; text-transform: uppercase; }
  .difftools .spacer { margin-left: auto; }
  .toggle { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; color: var(--ink-soft); text-transform: none; letter-spacing: 0; font-size: 12px; }
  .toggle input { accent-color: var(--accent); margin: 0; }
  .files { display: flex; flex-direction: column; }
  .file { border-bottom: 1px solid var(--line); }
  .file:last-child { border-bottom: 0; }
  .file-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 26px; background: var(--surface-2); border: 0; border-bottom: 1px solid var(--line); font: inherit; color: inherit; cursor: pointer; text-align: left; }
  .file-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .chev { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); width: 10px; flex: none; transition: transform .14s; }
  .file[data-open="false"] .chev { transform: rotate(-90deg); }
  .fpath { font-family: var(--mono); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 2px; flex: none; }
  .status.added { background: var(--add-bg); color: var(--add); }
  .status.deleted { background: var(--del-bg); color: var(--del); }
  .status.modified { background: var(--accent-soft); color: var(--accent-ink); }
  .fstat { margin-left: auto; font-family: var(--mono); font-size: 11.5px; flex: none; font-variant-numeric: tabular-nums; }
  .fstat .plus { color: var(--add); }
  .fstat .minus { color: var(--del); }
  .file[data-open="false"] .diffwrap { display: none; }
  .diffwrap { overflow-x: auto; }
  table.diff { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: 12.5px; line-height: 1.65; }
  table.diff td { padding: 0; vertical-align: top; }
  .gut { width: 1%; white-space: nowrap; text-align: right; padding: 0 10px 0 24px !important; color: var(--ink-faint); font-variant-numeric: tabular-nums; user-select: none; font-size: 11.5px; }
  .sign { width: 1%; padding: 0 6px !important; user-select: none; text-align: center; color: var(--ink-faint); }
  .code { white-space: pre; padding-right: 24px !important; }
  body.wrap .code { white-space: pre-wrap; overflow-wrap: anywhere; }
  tr.add { background: var(--add-bg); }
  tr.add .gut { background: var(--add-gutter); color: var(--add); }
  tr.add .sign { color: var(--add); }
  tr.del { background: var(--del-bg); }
  tr.del .gut { background: var(--del-gutter); color: var(--del); }
  tr.del .sign { color: var(--del); }
  tr.hunk td { background: var(--surface-2); color: var(--ink-faint); padding: 5px 14px !important; font-size: 11.5px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  body.only-changes tr.ctx { display: none; }

  .msg { padding: 20px 26px; border-top: 1px solid var(--line); }
  .msg summary { font-family: var(--mono); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); cursor: pointer; }
  .msg summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .msg pre { font-family: var(--mono); font-size: 12.5px; line-height: 1.62; white-space: pre-wrap; color: var(--ink-soft); margin: 14px 0 0; overflow-x: auto; }

  /* ---------- open questions ---------- */
  .openq { margin-top: 40px; padding-top: 26px; border-top: 1px solid var(--line); }
  .qgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(258px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .q { background: var(--surface); padding: 17px 19px; display: flex; flex-direction: column; gap: 7px; }
  .q .qk { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--del); }
  .q.info .qk { color: var(--accent); }
  .q .qt { font-size: 14.5px; font-weight: 500; line-height: 1.35; }
  .q p { margin: 0; font-size: 13.5px; color: var(--ink-soft); }
  footer { margin-top: 34px; font-family: var(--mono); font-size: 11px; color: var(--ink-faint); display: flex; flex-wrap: wrap; gap: 8px; }
  footer .sep { color: var(--line); }

  /* ---------- inline Q&A ---------- */
  .gut { cursor: pointer; position: relative; }
  table.diff tr:hover .gut::after { content: "?"; position: absolute; right: 2px; top: 0; font-size: 10px; color: var(--accent); }
  /* A 5px dot was easy to miss and hard to aim at. A line carrying threads gets a bar
     down the gutter and a badge with the number of them, and the whole line is clickable. */
  table.diff tr[data-asked] .gut { box-shadow: inset 3px 0 0 var(--accent); }
  table.diff tr[data-asked] .gut::before { content: ""; position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 9px; height: 9px; box-sizing: border-box; border-radius: 50%; background: var(--accent); }
  /* Nothing on the page starts a second thread on a line, so a count would read "1" every
     time. Older state can still hold two, and the inline layout can still make one, so the
     number appears when there is more than one to count and the dot stands alone
     otherwise. */
  table.diff tr[data-asked] .gut[data-threads]::before { content: attr(data-threads); left: 7px; width: auto; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; color: var(--on-accent); font-size: 9.5px; font-weight: 600; line-height: 14px; text-align: center; }
  table.diff tr[data-asked] td { cursor: pointer; }

<div class="shell">

<script>
  const DATA = /*__DATA__*/;

  const STAGES = DATA.stages || [];

  const STORE = `web-reviewer/${DATA.repo}/${DATA.range}/reviewed`;
  const reviewed = new Set();
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || "[]");
    if (Array.isArray(saved)) saved.forEach(s => reviewed.add(s));
  } catch (e) { /* private window or blocked storage: start empty */ }

  const save = () => {
    try { localStorage.setItem(STORE, JSON.stringify([...reviewed])); } catch (e) { /* nothing to do */ }
  };

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };
  const rich = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    n.innerHTML = html;
    return n;
  };

  /* Every helper the render functions use lives here, above the first render call.
     A const declared further down is in its temporal dead zone when an earlier
     block runs, which throws and leaves the page half drawn. */
  const escapeHtml = s => String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  /* Inline markdown: `code` and **bold**. Code spans are lifted out before bold
     runs, so a * inside one is never read as markup, and bold still spans a code
     span the way **`.git/shallow`.** does. Bold stays on one line: a stray ** would
     otherwise pair across paragraphs. Single-* italic is deliberately not supported,
     because a line like "tool/*.py bin/*.js" would read as emphasis. */
  const inlineMd = s => {
    const spans = [];
    let out = s.replace(/`([^`\n]+)`/g, (_, body) => "\u0000" + (spans.push(body) - 1) + "\u0000");
    out = out.replace(/\*\*([^\n]+?)\*\*/g, "<strong>$1</strong>");
    return out.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + spans[i] + "</code>");
  };

  /* ```fenced``` blocks become <pre>; the odd chunks of a split on ``` are the
     insides. Without this the inline regex above pairs the fence backticks with
     each other and renders the block as a run of inline code spans. */
  const md = s => {
    const chunks = String(s).split("```");
    return chunks.map((chunk, i) => {
      if (i % 2 === 1) {
        // drop the language tag on the opening line, and the newline before the close
        const body = chunk.includes("\n") ? chunk.replace(/^[^\n]*\n/, "") : chunk;
        return "<pre><code>" + body.replace(/\n+$/, "") + "</code></pre>";
      }
      // The newline closing the text before a fence and the one opening the text
      // after it are the fence's own; pre-wrap would show them as blank lines.
      let text = chunk;
      if (i > 0) text = text.replace(/^\n/, "");
      if (i < chunks.length - 1) text = text.replace(/\n$/, "");
      return inlineMd(text);
    }).join("");
  };

  /* A commit and the fixups folded into it. Declared up here with the other helpers:
     renderCommit calls it during the first render, well above the anchor block where it
     used to live, and a const in its temporal dead zone throws and leaves a half-drawn
     page. */
  const withFollowups = c => [c, ...(c.followups || [])];

  /* A fixup's sha stops existing when git squashes it, so a thread that recorded its
     change against one is pointing at something with a shelf life. The commit it folds
     into does not move, so the thread can say where the change actually lands. */
  const FOLDED_INTO = new Map();
  DATA.commits.forEach(c => (c.followups || []).forEach(f => FOLDED_INTO.set(f.short, c)));
  const foldedInto = sha => {
    if (!sha) return null;
    if (FOLDED_INTO.has(sha)) return FOLDED_INTO.get(sha);
    // --did and the diff can abbreviate to different lengths.
    for (const [short, target] of FOLDED_INTO) {
      if (short.startsWith(sha) || sha.startsWith(short)) return target;
    }
    return null;
  };

  let selected = 0;

  /* The commits built into this page. The server reports the ones in the range now, and
     the two stop matching when a commit lands. The diff is baked in at build time, so
     without this the reader sees a stale page with no sign that it is stale. */
  /* Follow-ups count. The server lists what git lists, and git does not know a fixup was
     folded into its target, so leaving them out left this permanently short of the
     server's answer and the staleness bar permanently on. */
  const BUILT_REVISION = (DATA.commits || [])
    .flatMap(c => withFollowups(c).map(x => x.hash)).sort().join(",");

  /* ---------- masthead ---------- */
  document.title = DATA.title;
  document.getElementById("pageTitle").textContent = DATA.title;
  document.getElementById("pageDek").textContent = DATA.dek;
  document.getElementById("branch").textContent = DATA.branch;
  document.getElementById("pageRange").textContent =
    `${DATA.commits.length} commit${DATA.commits.length === 1 ? "" : "s"} · ${DATA.range}`;
  if (DATA.eyebrow) {
    const brow = document.getElementById("pageEyebrow");
    brow.textContent = DATA.eyebrow;
    brow.hidden = false;
  }
  document.getElementById("footTotals").textContent = DATA.totals || DATA.range;
  document.getElementById("flowSection").hidden = !(DATA.stages || []).length;
  document.getElementById("flowTitle").textContent =
    DATA.stagesTitle || "Stages of this change, and which commit touches each one";

  const figures = DATA.figures || [];
  const figWrap = document.getElementById("figures");
  figures.forEach(f => {
    const box = el("div", "figure");
    const v = el("span", "v");
    if (f.was) {
      v.appendChild(el("span", "was", f.was));
      v.appendChild(document.createTextNode(" "));
      v.appendChild(el("span", "now", f.v));
    }
    else { v.textContent = f.v; }
    box.appendChild(v);
    box.appendChild(el("span", "k", f.k));
    figWrap.appendChild(box);
  });

  /* ---------- flow strip ---------- */
  const stageWrap = document.getElementById("stages");
  STAGES.forEach(s => {
    const box = el("div", "stage");
    box.appendChild(el("span", "where", s.where));
    box.appendChild(el("span", "what", s.what));
    const marks = el("div", "marks");
    s.marks.forEach(m => marks.appendChild(el("span", "mark", m)));
    box.appendChild(marks);
    stageWrap.appendChild(box);
  });

  const notes = DATA.notes || [];
  if (notes.length) {
    const list = document.getElementById("notesList");
    notes.forEach(n => {
      const card = el("div", "q" + (n.tone === "info" ? " info" : ""));
      card.appendChild(el("span", "qk", n.kind || "note"));
      card.appendChild(el("span", "qt", n.title || ""));
      card.appendChild(rich("p", null, md(escapeHtml(n.body || ""))));
      list.appendChild(card);
    });
    document.getElementById("notesSection").hidden = false;
  }

  /* ---------- rail ---------- */
  const railWrap = document.getElementById("commits");
  DATA.commits.forEach((c, i) => {
    const btn = el("button", "commit-btn");
    btn.type = "button";
    btn.appendChild(el("span", "cb-num", String(i + 1)));
    const body = el("div", "cb-body");
    /* The mark rides above the diff numbers, because it is what decides whether the
       reader opens this commit at all. A skimmable one is dimmed rather than hidden:
       still there to open, no longer competing for attention. */
    if (c.read) {
      btn.classList.add("is-" + c.read);
      const head = el("div", "cb-headrow");
      head.appendChild(el("span", "cb-tag " + c.read, c.read === "start" ? "start here" : c.read));
      head.appendChild(el("span", "cb-head", c.headline));
      body.appendChild(head);
      if (c.readWhy) body.appendChild(el("div", "cb-why", c.readWhy));
    } else {
      body.appendChild(el("span", "cb-head", c.headline));
    }
    const meta = el("div", "cb-meta");
    const total = Math.max(c.additions + c.deletions, 1);
    const bar = el("span", "bar");
    const a = el("i", "a"); a.style.width = (c.additions / total * 100) + "%";
    const d = el("i", "d"); d.style.width = (c.deletions / total * 100) + "%";
    bar.appendChild(a); bar.appendChild(d);
    meta.appendChild(bar);
    meta.appendChild(el("span", "plus", "+" + c.additions));
    meta.appendChild(el("span", "minus", "−" + c.deletions));
    const doneTag = el("span", "done", "reviewed");
    doneTag.hidden = !reviewed.has(c.short);
    meta.appendChild(doneTag);
    body.appendChild(meta);
    btn.appendChild(body);
    btn.addEventListener("click", () => select(i));
    railWrap.appendChild(btn);
    c._btn = btn; c._doneTag = doneTag;
  });

  function refreshProgress() {
    const n = DATA.commits.filter(c => reviewed.has(c.short)).length;
    document.getElementById("progressText").textContent = n + " of " + DATA.commits.length + " reviewed";
    document.getElementById("progressBar").style.width = (n / DATA.commits.length * 100) + "%";
    DATA.commits.forEach(c => { c._doneTag.hidden = !reviewed.has(c.short); });
    refreshSquash(n);
  }

  const FIXUP_COUNT = DATA.commits.reduce((n, c) => n + (c.followups || []).length, 0);
  const FIXUP_TARGETS = DATA.commits.filter(c => (c.followups || []).length).length;

  /* Squashing is what you do after reading everything, so the bar waits until every
     commit is ticked. Before that it would be one more thing to ignore. */
  function refreshSquash(reviewedCount) {
    const bar = document.getElementById("squash");
    if (!FIXUP_COUNT || reviewedCount < DATA.commits.length) { bar.hidden = true; return; }
    document.getElementById("squashText").textContent =
      "Every commit reviewed. " + FIXUP_COUNT + (FIXUP_COUNT === 1 ? " fixup" : " fixups")
      + " can be squashed into " + FIXUP_TARGETS + (FIXUP_TARGETS === 1 ? " commit." : " commits.");
    bar.hidden = false;
  }

  /* ---------- diff rendering ---------- */
  function renderFile(f, commitShort, anchored = true) {
    const box = el("section", "file");
    box.dataset.file = f.path;
    box.dataset.commit = commitShort;
    box.dataset.open = f.collapsed ? "false" : "true";

    const head = el("button", "file-head");
    head.type = "button";
    head.appendChild(el("span", "chev", "▾"));
    head.appendChild(el("span", "fpath", f.path));
    head.appendChild(el("span", "status " + f.status, f.status));
    const stat = el("span", "fstat");
    stat.appendChild(el("span", "plus", "+" + f.additions));
    stat.appendChild(document.createTextNode(" "));
    stat.appendChild(el("span", "minus", "−" + f.deletions));
    head.appendChild(stat);
    box.appendChild(head);

    /* A closed file builds nothing until it is opened. Hiding rows with CSS still costs
       the DOM for them, and a view holding every file of a branch pays that cost before
       the reader has asked for any of it. */
    let built = box.dataset.open === "true";
    head.addEventListener("click", () => {
      const opening = box.dataset.open !== "true";
      if (opening && !built) { box.appendChild(buildRows()); built = true; }
      box.dataset.open = opening ? "true" : "false";
    });

    function buildRows() {
    const wrap = el("div", "diffwrap");
    const table = el("table", "diff");
    const tbody = el("tbody");
    f.rows.forEach(r => {
      const tr = el("tr", r.t);
      if (r.t === "hunk") {
        const td = el("td", "code");
        td.colSpan = 3;
        td.textContent = r.text;
        tr.appendChild(td);
      } else {
        const lineNo = r.t === "del" ? r.o : r.n;
        /* A thread anchors to a commit, a file and a line. The files view has no single
           commit behind a line, so its rows carry no anchor, and the click handler that
           opens a question matches on data-line and passes them over. */
        if (anchored) {
          tr.dataset.commit = commitShort;
          tr.dataset.file = f.path;
          tr.dataset.side = r.t;
          tr.dataset.line = String(lineNo);
          tr.dataset.code = r.text;
        }
        tr.appendChild(el("td", "gut", String(lineNo)));
        tr.appendChild(el("td", "sign", r.t === "add" ? "+" : r.t === "del" ? "−" : ""));
        tr.appendChild(el("td", "code", r.text));
      }
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    return wrap;
    }

    if (built) box.appendChild(buildRows());
    return box;
  }

  function renderMatrix(matrix, caption) {
    const sec = el("section", "verified");
    sec.appendChild(el("h4", null, caption || "What was checked"));
    const wrap = el("div", "vwrap");
    const table = el("table", "matrix");
    const thead = el("thead");
    const hr = el("tr");
    ["Case", "Exit", "Expected", ""].forEach(h => hr.appendChild(el("th", null, h)));
    thead.appendChild(hr);
    table.appendChild(thead);
    const tbody = el("tbody");
    matrix.forEach(([label, got, want, ok]) => {
      const tr = el("tr");
      tr.appendChild(el("td", null, label));
      tr.appendChild(el("td", "num", got));
      tr.appendChild(el("td", "num", want));
      tr.appendChild(el("td", "ok", ok ? "✓ match" : "✗ differs"));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    sec.appendChild(wrap);
    return sec;
  }


  function select(i) {
    selected = i;
    const c = DATA.commits[i];
    DATA.commits.forEach((o, j) => o._btn.setAttribute("aria-current", String(j === i)));

    const pane = document.getElementById("pane");
    pane.replaceChildren();

    const head = el("header", "pane-head");
    const kindrow = el("div", "kindrow");
    if (c.kind) kindrow.appendChild(el("span", "kind", c.kind));
    kindrow.appendChild(el("span", "sha", c.short));
    if (c.flow) kindrow.appendChild(el("span", "stagetag", c.flow));
    head.appendChild(kindrow);
    head.appendChild(el("h3", null, c.headline));
    if (c.why) head.appendChild(rich("p", "why", md(escapeHtml(c.why))));
    const ul = el("ul", "points");
    c.points.forEach(p => ul.appendChild(rich("li", null, md(escapeHtml(p)))));
    head.appendChild(ul);
    pane.appendChild(head);

    if (c.matrix) pane.appendChild(renderMatrix(c.matrix, c.matrixCaption));

    const tools = el("div", "difftools");
    const paneFiles = withFollowups(c).reduce((n, src) => n + src.files.length, 0);
    tools.appendChild(el("span", null, paneFiles === 1 ? "1 file" : paneFiles + " files"));
    const spacer = el("span", "spacer");
    tools.appendChild(spacer);

    const mkToggle = (label, cls, initial, after) => {
      const lab = el("label", "toggle");
      const cb = el("input");
      cb.type = "checkbox";
      cb.checked = initial;
      cb.addEventListener("change", () => {
        document.body.classList.toggle(cls, cb.checked);
        if (after) after();
      });
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode(label));
      return lab;
    };
    tools.appendChild(mkToggle("Changes only", "only-changes", document.body.classList.contains("only-changes")));
    tools.appendChild(mkToggle("Wrap lines", "wrap", document.body.classList.contains("wrap")));
    tools.appendChild(mkToggle("Hide resolved", "hide-resolved", document.body.classList.contains("hide-resolved")));
    tools.appendChild(mkToggle("Thread at the side", "side-threads",
      document.body.classList.contains("side-threads"), () => { closeSide(); paintThreads(); }));

    const done = el("label", "toggle");
    const donecb = el("input");
    donecb.type = "checkbox";
    donecb.checked = reviewed.has(c.short);
    donecb.addEventListener("change", () => {
      if (donecb.checked) reviewed.add(c.short); else reviewed.delete(c.short);
      save();
      refreshProgress();
    });
    done.appendChild(donecb);
    done.appendChild(document.createTextNode("Mark reviewed"));
    tools.appendChild(done);
    pane.appendChild(tools);

    const files = el("div", "files");
    c.files.forEach(f => files.appendChild(renderFile(f, c.short)));
    const fixups = c.followups || [];
    fixups.forEach((fu, i) => {
      const block = el("div", "followup");
      const mark = el("div", "followup-head");
      mark.appendChild(el("span", "tag",
        fixups.length === 1 ? "fixup" : "fixup " + (i + 1) + " of " + fixups.length));
      mark.appendChild(el("span", "sha", fu.short));
      mark.appendChild(el("span", "sub", fu.headline || fu.subject));
      mark.appendChild(el("span", "stat", "+" + fu.additions + " −" + fu.deletions));
      block.appendChild(mark);
      // Said once per commit, not once per fixup, since three of them repeat it three times.
      if (i === 0) {
        block.appendChild(el("div", "followup-note",
          "A later commit that amends " + c.short + ". Its diff is separate here, and stays "
          + "separate until git squashes it into " + c.short + "."));
      }
      fu.files.forEach(f => block.appendChild(renderFile(f, fu.short)));
      files.appendChild(block);
    });
    pane.appendChild(files);

    const msg = el("details", "msg");
    msg.appendChild(el("summary", null, "Full commit message"));
    msg.appendChild(el("pre", null, c.subject + "\n\n" + c.body));
    pane.appendChild(msg);
  }

  /* The layout under test is the default, and long lines wrap rather than run off the
     side. Set before the first render, because the diff tools read these classes to
     decide whether their toggles start checked. */
  document.body.classList.add("side-threads");
  document.body.classList.add("wrap");

  select(0);
  refreshProgress();


  /* ---------- inline Q&A with Claude ---------- */
  let THREADS = [];
  /* Whether a Monitor is tailing the logs. Assumed true until the first poll says
     otherwise, so a live review never flashes the detached state on load. */
  let WATCHER_LIVE = true;
  /* The thread whose reply box has focus, so a repaint can carry its draft across. */
  let typingIn = null;
  let repaintPending = false;
  /* The live textarea per thread, so a repaint can hand a half-typed reply to the
     element that replaces it. */
  const replyInputs = new Map();

  /* Declines written before the reply carried a kind. Matched on the exact text the
     button sent, so threads already on disk settle too. */
  const LEGACY_SKIP = "No, skip the investigation.";

  function isSkip(turn) {
    if (!turn || turn.role === "claude") return false;
    return turn.kind === "skip" || turn.text === LEGACY_SKIP;
  }

  /* Every anchor the loaded range can still render. A thread outside it is orphaned,
     which happens when a commit is amended or rebased away. */
  const VALID_ANCHORS = new Set();
  DATA.commits.forEach(c => withFollowups(c).forEach(src => src.files.forEach(f => f.rows.forEach(r => {
    if (r.t === "hunk") return;
    VALID_ANCHORS.add([src.short, f.path, r.t, String(r.t === "del" ? r.o : r.n)].join("\u0000"));
  }))));
  let composerOpen = false;
  const anchorKey = d => [d.commit, d.file, d.side, d.line].join("\u0000");

  /* Threads live in the commits view only, so every scan for a row runs over that
     subtree rather than the document. The files view holds a second copy of the branch
     once it has been opened, and the poll walks this every few seconds. */
  const board = () => document.getElementById("board");

  /* The branch this page was built for. A thread carries the branch it was asked about,
     so the two together say whether a thread belongs to this review at all. The store is
     keyed by repo, so every review of this checkout shares it.

     A thread with no branch was written before threads carried one, and a build on a
     detached HEAD has no branch either. Neither can be claimed for this review, so the
     match has to be a real one on both sides. */
  const REVIEW_BRANCH = DATA.branch || "";
  const sameReview = t => !!REVIEW_BRANCH && (t.branch || "") === REVIEW_BRANCH;
  const fromThisReview = t => VALID_ANCHORS.has(anchorKey(t)) || sameReview(t);

  function threadsByAnchor() {
    const map = new Map();
    THREADS.forEach(t => {
      const key = anchorKey(t);
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(t);
    });
    return map;
  }

  function orphanCard(t, why) {
    const box = el("div", "orphan");
    box.appendChild(el("div", "where",
      (t.commit || "?") + " · " + (t.file || "?") + ":" + (t.line || "?") + " · " + why));
    if (t.code) box.appendChild(el("div", "snippet", t.code));
    const q = el("div", "turn you");
    q.appendChild(el("span", "who", "you"));
    q.appendChild(el("div", "said", t.question));
    box.appendChild(q);
    (t.turns || []).forEach(turn => box.appendChild(renderTurn(turn)));
    if (!t.resolved) {
      box.appendChild(replyBox(t.id));
    } else {
      box.appendChild(el("div", "where", "resolved"));
    }
    return box;
  }

  function paintOrphans() {
    const orphans = THREADS.filter(t => !VALID_ANCHORS.has(anchorKey(t)));
    /* Two reasons a thread cannot be anchored, and they need different words. Its commit
       was rewritten out of this branch, which is the case the section was written for. Or
       it was asked about a different branch and shares this store, which is not this
       review's business and is put away rather than mixed in. */
    const mine = orphans.filter(sameReview);
    const theirs = orphans.filter(t => !sameReview(t));

    const section = document.getElementById("orphans");
    const list = document.getElementById("orphanList");
    section.hidden = mine.length === 0;
    list.replaceChildren();
    mine.forEach(t => list.appendChild(
      orphanCard(t, "this commit is not part of the diff shown here")));

    const other = document.getElementById("otherReviews");
    const otherList = document.getElementById("otherReviewList");
    other.hidden = theirs.length === 0;
    otherList.replaceChildren();
    if (theirs.length) {
      const branches = [...new Set(theirs.map(t => t.branch).filter(Boolean))];
      document.getElementById("otherReviewsSummary").textContent =
        theirs.length + (theirs.length === 1 ? " thread" : " threads") + " from "
        + (branches.length ? branches.join(", ") : "an earlier review of this repo");
      theirs.forEach(t => otherList.appendChild(
        orphanCard(t, t.branch ? "asked on " + t.branch : "asked before threads recorded a branch")));
    }
  }

  /* One thread renderer for both layouts: the row under the line, and the docked panel.
     Only the container differs. */
  function buildThread(list) {
    const allResolved = list.every(t => t.resolved);
    const thread = el("div", "thread" + (allResolved ? " done" : ""));
    list.forEach(t => {
      if (t.resolved) {
        // Reading a resolved thread used to mean reopening it, which changed its state
        // just to look. It opens in place now, and Reopen sits inside, where it is a
        // decision rather than the only way in.
        const box = el("details", "resolved-thread");
        const line = el("summary", "resolved-line");
        line.appendChild(el("span", "tick", "resolved"));
        line.appendChild(el("span", "q", t.question));
        line.appendChild(el("span", "caret"));
        box.appendChild(line);

        const body = el("div", "resolved-body");
        const asked = el("div", "turn you");
        asked.appendChild(el("span", "who", "you"));
        asked.appendChild(el("div", "said", t.question));
        body.appendChild(asked);
        (t.turns || []).forEach(turn => body.appendChild(renderTurn(turn)));
        const acts = el("div", "acts");
        const reopen = el("button", "btn ghost small", "Reopen");
        reopen.type = "button";
        reopen.addEventListener("click", () => setResolved(t.id, false));
        acts.appendChild(reopen);
        body.appendChild(acts);
        box.appendChild(body);

        thread.appendChild(box);
        return;
      }
      const q = el("div", "turn you");
      q.appendChild(el("span", "who", "you"));
      q.appendChild(el("div", "said", t.question));
      thread.appendChild(q);

      (t.turns || []).forEach(turn => thread.appendChild(renderTurn(turn)));

      const turns = t.turns || [];
      const lastTurn = turns[turns.length - 1];
      if (lastTurn && lastTurn.role === "claude" && lastTurn.kind === "ask") {
        const call = el("div", "yourcall");
        call.appendChild(document.createTextNode("waiting for you"));
        const go = el("button", "btn small", "Yes, investigate");
        go.type = "button";
        go.addEventListener("click", () => sendReply(t.id, "Yes, run the deep investigation.", "go"));
        call.appendChild(go);
        const no = el("button", "btn ghost small", "No, skip it");
        no.type = "button";
        no.addEventListener("click", () => sendReply(t.id, "No, skip the investigation.", "skip"));
        call.appendChild(no);
        thread.appendChild(call);
      } else if (isSkip(lastTurn)) {
        /* The reviewer turned the investigation down, so nobody owes this thread an
           answer and it must not read as though someone does. */
        const done = el("div", "pending settled");
        done.appendChild(el("i", "dot"));
        done.appendChild(document.createTextNode("investigation skipped · nothing owed"));
        thread.appendChild(done);
      } else if (!lastTurn || lastTurn.role !== "claude") {
        /* A pulsing "waiting" with no session attached promises an answer that cannot
           come. The question is on disk either way, so say which of the two it is. */
        const wait = el("div", WATCHER_LIVE ? "pending" : "pending detached");
        wait.appendChild(el("i", "dot"));
        wait.appendChild(document.createTextNode(WATCHER_LIVE
          ? "waiting for an answer"
          : "no session attached · saved for when one starts"));
        if (!WATCHER_LIVE) {
          wait.title = "Nothing is watching the review log. A session that arms the "
            + "watcher picks this thread up from where it left off.";
        }
        thread.appendChild(wait);
      }

      thread.appendChild(replyBox(t.id));
    });
    return { thread, allResolved };
  }

  /* ---------- files changed, in the order the stages tell ---------- */

  const CONTEXT_ROWS = 3;

  /* One file, showing only what a stage wrote in it, with a few rows either side. A stage
     can be three lines in a file another stage owns, and those three lines are the whole
     of what it did: showing the file entire would bury them, and showing them alone would
     strip the code that gives them meaning. */
  function renderFileLines(f, runs) {
    const own = new Set();
    runs.forEach(([from, to]) => { for (let n = from; n <= to; n++) own.add(n); });

    const keep = new Set();
    f.rows.forEach((r, i) => {
      if (r.t !== "hunk" && r.n && own.has(r.n)) {
        for (let j = Math.max(0, i - CONTEXT_ROWS); j <= Math.min(f.rows.length - 1, i + CONTEXT_ROWS); j++) {
          keep.add(j);
        }
      }
    });
    if (!keep.size) return null;

    const box = el("section", "file");
    box.dataset.open = "true";
    const head = el("button", "file-head");
    head.type = "button";
    head.appendChild(el("span", "chev", "▾"));
    head.appendChild(el("span", "fpath", f.path));
    head.appendChild(el("span", "status " + f.status, f.status));
    head.addEventListener("click", () => {
      box.dataset.open = box.dataset.open === "true" ? "false" : "true";
    });
    box.appendChild(head);

    const wrap = el("div", "diffwrap");
    const table = el("table", "diff");
    const tbody = el("tbody");
    let last = -1;
    [...keep].sort((a, b) => a - b).forEach(i => {
      if (last >= 0 && i > last + 1) {
        const sep = el("tr");
        const td = el("td", "snip", "… " + (i - last - 1) + " line(s) not from this stage");
        td.colSpan = 3;
        sep.appendChild(td);
        tbody.appendChild(sep);
      }
      last = i;
      const r = f.rows[i];
      const tr = el("tr", r.t + (r.n && own.has(r.n) ? " own" : ""));
      if (r.t === "hunk") {
        const td = el("td", "code", r.text);
        td.colSpan = 3;
        tr.appendChild(td);
      } else {
        const lineNo = r.t === "del" ? r.o : r.n;
        tr.appendChild(el("td", "gut", String(lineNo)));
        tr.appendChild(el("td", "sign", r.t === "add" ? "+" : r.t === "del" ? "−" : ""));
        tr.appendChild(el("td", "code", r.text));
      }
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    box.appendChild(wrap);
    return box;
  }

  function paintStage(where) {
    const final = DATA.final;
    const groups = document.getElementById("fileGroups");
    const byWhat = new Map((DATA.stages || []).map(s => [s.where, s.what]));
    groups.replaceChildren();

    const pane = el("div", "stagepane");
    pane.appendChild(el("h3", null, where));
    if (byWhat.get(where)) pane.appendChild(el("p", "what", byWhat.get(where)));

    let drawn = 0;
    final.files.forEach(f => {
      const runs = (f.runs || {})[where];
      if (!runs || !runs.length) return;
      const box = renderFileLines(f, runs);
      if (box) { pane.appendChild(box); drawn += 1; }
    });
    if (!drawn) {
      pane.appendChild(el("p", "filesnote",
        "Nothing of this stage survives in the branch as it stands. Its commits are on the "
        + "Commits tab."));
    }
    groups.appendChild(pane);
  }

  function paintAllFiles() {
    const final = DATA.final;
    const groups = document.getElementById("fileGroups");
    const byWhat = new Map((DATA.stages || []).map(s => [s.where, s.what]));
    groups.replaceChildren();

    /* Grouped by the first stage that reaches a file, which is the order build_data
       sorted them into. A file no stage claims goes last under its own heading, so it
       is not silently attached to whichever group happens to be nearest. */
    /* Grouping orders files. With no more files than stages there is nothing to order,
       and six headings over two files say less than the two files do. */
    const grouped = final.order.length > 0 && final.files.length > final.order.length;

    let current = null;
    let box = null;
    final.files.forEach(f => {
      const owner = (f.stages && f.stages[0]) || null;
      if (!grouped) {
        if (!box) { box = el("div", "stagegroup"); groups.appendChild(box); }
      } else if (owner !== current || !box) {
        current = owner;
        box = el("div", "stagegroup");
        box.appendChild(el("h3", null, owner || "not part of any stage"));
        if (owner && byWhat.get(owner)) box.appendChild(el("p", "what", byWhat.get(owner)));
        groups.appendChild(box);
      }
      box.appendChild(renderFile({...f, collapsed: true}, null, false));

      const others = (f.stages || []).slice(grouped ? 1 : 0);
      if (others.length) {
        const line = el("div", "alsoin");
        /* A stage name can contain a comma, so the names are chips rather than a list
           joined by one, and each carries how many of the file's surviving lines that
           stage wrote. A file in most of the stages is counted instead of named: six
           names on one file is not a cross reference, it is the whole strip again. */
        if (final.order.length > 2 && f.stages.length > final.order.length / 2) {
          line.appendChild(document.createTextNode(
            "in " + f.stages.length + " of the " + final.order.length + " stages"));
        } else {
          line.appendChild(document.createTextNode(grouped ? "also in" : "in"));
          others.forEach(w => {
            const n = (f.lines || {})[w];
            line.appendChild(el("span", "chip", n ? w + " " + n : w));
          });
        }
        box.appendChild(line);
      }
    });

    /* A stage can write a handful of lines in files that other stages own, and then it
       has no section of its own and disappears from the view. Naming where its lines
       went keeps it on the page, because a small stage is often the interesting one. */
    if (grouped) {
      const owning = new Set(final.files.map(f => (f.stages || [])[0]).filter(Boolean));
      final.order.filter(w => !owning.has(w)).forEach(where => {
        const box = el("div", "stagegroup");
        box.appendChild(el("h3", null, where));
        if (byWhat.get(where)) box.appendChild(el("p", "what", byWhat.get(where)));
        const scattered = final.files
          .filter(f => (f.lines || {})[where])
          .sort((a, b) => b.lines[where] - a.lines[where]);
        const total = scattered.reduce((n, f) => n + f.lines[where], 0);
        const line = el("div", "alsoin");
        line.appendChild(document.createTextNode(
          total ? "no files of its own. " + total + " line(s), in" : "no files of its own"));
        scattered.forEach(f => line.appendChild(el("span", "chip", f.path + " " + f.lines[where])));
        box.appendChild(line);
        groups.appendChild(box);
      });
    }

  }

  /* The rail is the strip again, read as a list. Every file is the branch as it stands;
     a stage is only what that stage wrote, wherever it wrote it, so a file appears under
     each stage that touched it instead of one stage having to win it. */
  function paintFiles() {
    const final = DATA.final;
    if (!final || !final.files.length) return false;
    const rail = document.getElementById("stageRail");
    const byWhat = new Map((DATA.stages || []).map(s => [s.where, s.what]));
    const entries = [{ where: null, label: "Every file",
                       meta: final.files.length + " files" }];
    final.order.forEach(where => {
      const files = final.files.filter(f => ((f.runs || {})[where] || []).length);
      const lines = final.files.reduce((n, f) => n + ((f.lines || {})[where] || 0), 0);
      entries.push({ where, label: where,
                     meta: files.length + " file(s) · " + lines + " line(s)" });
    });

    const buttons = [];
    entries.forEach((entry, i) => {
      const btn = el("button", "commit-btn");
      btn.type = "button";
      btn.appendChild(el("span", "cb-num", entry.where === null ? "·" : String(i)));
      const body = el("div", "cb-body");
      body.appendChild(el("span", "cb-head", entry.label));
      if (entry.where && byWhat.get(entry.where)) {
        body.appendChild(el("div", "cb-why", byWhat.get(entry.where)));
      }
      body.appendChild(el("div", "cb-meta", entry.meta));
      btn.appendChild(body);
      btn.addEventListener("click", () => {
        buttons.forEach((b, j) => b.setAttribute("aria-current", String(j === i)));
        if (entry.where === null) paintAllFiles(); else paintStage(entry.where);
        document.getElementById("filesNote").textContent = entry.where === null
          ? final.files.length + " files as they stand now, grouped by stage."
          : "Only what " + entry.where + " wrote, with a few lines either side.";
      });
      buttons.push(btn);
      rail.appendChild(btn);
    });

    buttons[0].setAttribute("aria-current", "true");
    // With no stage strip the rail holds one entry and orders nothing, so it is not drawn.
    document.getElementById("stageRailNav").hidden = !final.order.length;
    paintAllFiles();
    document.getElementById("filesNote").textContent =
      final.files.length + " files as they stand now, grouped by stage. "
      + "Questions are asked on the Commits tab, where a line has a commit behind it.";
    return true;
  }

  function showTab(which) {
    const onFiles = which === "files";
    document.getElementById("filesView").hidden = !onFiles;
    document.getElementById("board").hidden = onFiles;
    document.getElementById("tabCommits").setAttribute("aria-selected", String(!onFiles));
    document.getElementById("tabFiles").setAttribute("aria-selected", String(onFiles));
  }

  let filesPainted = false;

  if (DATA.final && DATA.final.files.length) {
    document.getElementById("tabs").hidden = false;
    document.getElementById("tabCommits").textContent =
      "Commits " + DATA.commits.length;
    document.getElementById("tabFiles").textContent =
      "Files changed " + DATA.final.files.length;
    document.getElementById("tabCommits").addEventListener("click", () => showTab("commits"));
    document.getElementById("tabFiles").addEventListener("click", () => {
      // Built on the first visit, not at load. Most readings never leave the commits tab.
      if (!filesPainted) { paintFiles(); filesPainted = true; }
      showTab("files");
    });
  }

  /* ---------- the docked panel ---------- */

  /* The line the panel is showing, as an anchor key rather than an element, so a refresh
     redraws the same thread even though the rows were rebuilt underneath it. */
  let sideKey = null;
  const sideMode = () => document.body.classList.contains("side-threads");

  function closeSide() {
    sideKey = null;
    document.getElementById("side").hidden = true;
    document.body.classList.remove("side-open");
    board().querySelectorAll("tr.side-open-row")
      .forEach(n => n.classList.remove("side-open-row"));
  }

  function rowForKey(key) {
    return [...board().querySelectorAll("table.diff tr[data-line]")]
      .find(tr => anchorKey(tr.dataset) === key) || null;
  }

  function paintSide() {
    if (!sideKey) return;
    const tr = rowForKey(sideKey);
    const list = threadsByAnchor().get(sideKey);
    // The line can leave the page under us: another commit selected, or the thread
    // resolved and hidden. Closing beats showing a thread with nothing to point at.
    if (!tr || !list) { closeSide(); return; }

    board().querySelectorAll("tr.side-open-row")
      .forEach(n => n.classList.remove("side-open-row"));
    tr.classList.add("side-open-row");

    document.getElementById("sideAnchor").textContent =
      tr.dataset.file + "  line " + tr.dataset.line +
      (tr.dataset.side === "add" ? " (added)" : tr.dataset.side === "del" ? " (removed)" : "");
    document.getElementById("sideCode").textContent = tr.dataset.code || "";

    const body = document.getElementById("sideBody");
    body.replaceChildren();
    body.appendChild(buildThread(list).thread);

    document.getElementById("side").hidden = false;
    document.body.classList.add("side-open");
  }

  function openSide(tr) {
    sideKey = anchorKey(tr.dataset);
    paintSide();
  }

  function captureDraft(threadId) {
    const input = replyInputs.get(threadId);
    if (!input) return null;
    return {
      threadId,
      value: input.value || "",
      start: input.selectionStart,
      end: input.selectionEnd,
    };
  }

  function restoreDraft(draft) {
    // The thread can leave the page under us: another commit selected, or resolved.
    // The draft goes with it.
    const input = replyInputs.get(draft.threadId);
    if (!input) return;
    input.value = draft.value;
    if (typeof input.focus === "function") input.focus();
    if (typeof draft.start === "number" && typeof input.setSelectionRange === "function") {
      input.setSelectionRange(draft.start, draft.end);
    }
  }

  function paintThreads() {
    if (composerOpen) { repaintPending = true; return; }
    /* A poll must not wipe a half-typed reply, and must not skip the redraw to protect
       one either: a box holding focus would freeze the thread, hiding an answer that
       lands while it is open. Carry the draft across instead. */
    const draft = typingIn ? captureDraft(typingIn) : null;
    replyInputs.clear();
    board().querySelectorAll("tr.thread-row").forEach(n => n.remove());
    board().querySelectorAll("table.diff tr[data-asked]").forEach(n => {
      delete n.dataset.asked;
      const g = n.querySelector("td.gut");
      if (g) delete g.dataset.threads;
    });

    const byAnchor = threadsByAnchor();
    const side = sideMode();
    board().querySelectorAll("table.diff tr[data-line]").forEach(tr => {
      const list = byAnchor.get(anchorKey(tr.dataset));
      if (!list) return;
      const allResolved = list.every(t => t.resolved);
      tr.dataset.asked = allResolved ? "resolved" : "true";
      const gut = tr.querySelector("td.gut");
      if (gut) {
        if (list.length > 1) gut.dataset.threads = String(list.length);
        else delete gut.dataset.threads;
      }
      if (side) return;
      const row = el("tr", "thread-row");
      row.dataset.resolved = String(allResolved);
      const cell = el("td");
      cell.colSpan = 3;
      cell.appendChild(buildThread(list).thread);
      row.appendChild(cell);
      tr.after(row);
    });
    if (side) paintSide(); else closeSide();
  }

  function renderTurn(turn) {
    const isClaude = turn.role === "claude";
    const row = el("div", "turn " + (isClaude ? "claude" : "you") +
      (turn.kind === "ask" ? " ask" : ""));
    row.appendChild(el("span", "who", isClaude ? "claude" : "you"));
    if (turn.kind === "did") {
      const box = el("div", "said");
      const did = el("div", "did");
      did.appendChild(el("span", "landed", "changed"));
      if (turn.commit) did.appendChild(el("span", "sha", turn.commit));
      const target = foldedInto(String(turn.commit || "").split(" ")[0]);
      if (target) {
        did.appendChild(el("span", "into",
          "squashed into " + target.short + " " + target.headline));
      }
      if (turn.stat) did.appendChild(el("span", "stat", turn.stat));
      box.appendChild(did);
      box.appendChild(rich("div", null, md(escapeHtml(turn.text))));
      row.appendChild(box);
      return row;
    }
    row.appendChild(rich("div", "said", md(escapeHtml(turn.text))));
    return row;
  }


  async function sendReply(threadId, text, kind) {
    try {
      const res = await fetch("/reply", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ thread_id: threadId, text, kind: kind || "answer" })
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      typingIn = null;
      await refresh();
      return true;
    } catch (err) {
      setStatus(false, "could not reply: " + err.message);
      return false;
    }
  }

  function replyBox(threadId) {
    const box = el("div", "reply");
    const input = el("textarea");
    input.placeholder = "Reply in this thread…";
    const send = el("button", "btn small", "Reply");
    send.type = "button";

    const submit = async () => {
      const text = input.value.trim();
      if (!text) return;
      send.disabled = true;
      send.textContent = "Sending…";
      if (await sendReply(threadId, text)) {
        input.value = "";
      } else {
        send.disabled = false;
        send.textContent = "Reply";
      }
    };

    replyInputs.set(threadId, input);
    input.addEventListener("focus", () => { typingIn = threadId; });
    input.addEventListener("blur", () => {
      if (!input.value.trim()) {
        typingIn = null;
        if (repaintPending) { repaintPending = false; paintThreads(); }
      }
    });
    input.addEventListener("keydown", e => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submit(); }
    });
    send.addEventListener("click", submit);

    box.appendChild(input);
    const row = el("div", "row");
    row.appendChild(send);
    row.appendChild(el("span", "hint", "⌘/Ctrl + Enter to send"));
    const resolve = el("button", "btn ghost small resolve", "Resolve");
    resolve.type = "button";
    resolve.addEventListener("click", () => setResolved(threadId, true));
    row.appendChild(resolve);
    box.appendChild(row);
    return box;
  }

  async function setResolved(questionId, resolved) {
    try {
      const res = await fetch("/resolve", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question_id: questionId, resolved })
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      await refresh();
    } catch (err) {
      setStatus(false, "could not resolve: " + err.message);
    }
  }

  function closeComposer() {
    document.querySelectorAll("tr.composer-row").forEach(n => n.remove());
    composerOpen = false;
  }

  function openComposer(tr) {
    closeComposer();
    composerOpen = true;
    const row = el("tr", "composer-row");
    const cell = el("td");
    cell.colSpan = 3;
    const box = el("div", "composer");
    box.appendChild(el("div", "anchor",
      tr.dataset.file + "  line " + tr.dataset.line +
      (tr.dataset.side === "add" ? " (added)" : tr.dataset.side === "del" ? " (removed)" : "")));
    const input = el("textarea");
    input.placeholder = "Ask Claude about this line…";
    box.appendChild(input);
    const controls = el("div", "row");
    const send = el("button", "btn", "Ask Claude");
    send.type = "button";
    const cancel = el("button", "btn ghost", "Cancel");
    cancel.type = "button";
    controls.appendChild(send);
    controls.appendChild(cancel);
    controls.appendChild(el("span", "hint", "⌘/Ctrl + Enter to send · Esc to close"));
    box.appendChild(controls);
    cell.appendChild(box);
    row.appendChild(cell);
    tr.after(row);
    input.focus();

    const submit = async () => {
      const question = input.value.trim();
      if (!question) return;
      send.disabled = true;
      send.textContent = "Sending…";
      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question,
            commit: tr.dataset.commit,
            file: tr.dataset.file,
            side: tr.dataset.side,
            line: tr.dataset.line,
            code: tr.dataset.code
          })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        closeComposer();
        await refresh();
        if (sideMode()) openSide(tr);
      } catch (err) {
        send.disabled = false;
        send.textContent = "Ask Claude";
        setStatus(false, "could not send: " + err.message);
      }
    };
    send.addEventListener("click", submit);
    cancel.addEventListener("click", closeComposer);
    input.addEventListener("keydown", e => {
      if (e.key === "Escape") { e.preventDefault(); closeComposer(); }
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submit(); }
    });
  }

  function setStatus(up, text) {
    document.getElementById("qnaLive").classList.toggle("down", !up);
    document.getElementById("qnaStatus").textContent = text;
  }

  async function refresh() {
    try {
      const res = await fetch("/thread", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const body = await res.json();
      setStale(body.revision);
      const watcherWas = WATCHER_LIVE;
      WATCHER_LIVE = body.watcher !== false;
      const next = JSON.stringify(body.threads);
      if (next !== JSON.stringify(THREADS) || WATCHER_LIVE !== watcherWas) {
        THREADS = body.threads;
        paintThreads();
        paintOrphans();
      }
      /* Counted over this review only. The store is shared by every review of this
         repo, so counting all of it reported threads from another branch as questions
         asked here, on a page where none had been. */
      const here = THREADS.filter(fromThisReview);
      const open = here.filter(t => !t.resolved).length;
      const unanswered = here.filter(t => {
        if (t.resolved) return false;
        const turns = t.turns || [];
        const last = turns[turns.length - 1];
        if (isSkip(last)) return false;
        return !turns.length || last.role !== "claude";
      }).length;
      const yourCall = here.filter(t => {
        if (t.resolved) return false;
        const last = (t.turns || [])[(t.turns || []).length - 1];
        return last && last.role === "claude" && last.kind === "ask";
      }).length;
      setStatus(true, here.length
        ? `${here.length} asked · ${open} open` +
          (unanswered ? (WATCHER_LIVE
            ? ` · ${unanswered} waiting for an answer`
            : ` · ${unanswered} undelivered · no session attached`) : "") +
          (yourCall ? ` · ${yourCall} waiting for you` : "")
        : "Ask a question by clicking a line number");
    } catch (err) {
      setStatus(false, "Not connected · restart the review server");
    }
  }

  document.addEventListener("click", e => {
    const tr = e.target.closest("tr[data-line]");
    if (!tr) return;
    if (sideMode() && threadsByAnchor().has(anchorKey(tr.dataset))) {
      // Reading a line often means selecting part of it. A drag that ends on the row is
      // a selection, not a click on the thread.
      if (String(window.getSelection() || "").trim()) return;
      openSide(tr);
      return;
    }
    if (e.target.closest("td.gut")) openComposer(tr);
  });

  document.getElementById("sideClose").addEventListener("click", closeSide);

  /* A squash rebuilds the page on disk itself, so afterwards this tab is behind only
     until it reloads. The staleness bar would offer to rebuild what is already built,
     leaving two bars with two buttons for one action. */
  let rebuiltAwaitingReload = false;

  function setStale(revision) {
    const bar = document.getElementById("stale");
    // "" means the server could not resolve the range. Unknown is not a reason to nag.
    if (!revision || revision === BUILT_REVISION) { bar.hidden = true; return; }
    if (rebuiltAwaitingReload) { bar.hidden = true; return; }
    const built = new Set(BUILT_REVISION.split(","));
    const added = revision.split(",").filter(h => h && !built.has(h)).length;
    document.getElementById("staleText").textContent =
      added === 0 ? "This branch changed since the page was built."
      : added === 1 ? "1 new commit on this branch."
      : added + " new commits on this branch.";
    bar.hidden = false;
  }

  async function runSquash(button, force) {
    button.disabled = true;
    button.textContent = "Squashing…";
    try {
      const res = await fetch("/squash", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ force: !!force }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        // The pushed-branch guard is the one worth offering to override, and only after
        // saying what it costs.
        if (body.needsForce && window.confirm(body.error + "\n\nSquash anyway?")) {
          return runSquash(button, true);
        }
        throw new Error(body.error || "HTTP " + res.status);
      }
      // The backup branch is the way back, so it is shown and waited on rather than
      // flashed past by an immediate reload.
      rebuiltAwaitingReload = true;
      document.getElementById("stale").hidden = true;
      document.getElementById("squashText").textContent =
        body.before + " commits became " + body.after + ". Undo with: git reset --hard " + body.backup;
      button.disabled = false;
      button.textContent = "Reload";
      /* The click handler is registered with addEventListener, which assigning
         onclick does not replace. Setting both ran the reload and the squash confirm
         from one press, so pressing Reload asked to squash again. The handler reads
         this instead. */
      button.dataset.done = "true";
    } catch (err) {
      button.disabled = false;
      button.textContent = "Squash fixups";
      delete button.dataset.done;
      // Next to the button as well as in the status strip: a refusal that only lands in
      // the strip reads as the button doing nothing at all.
      document.getElementById("squashText").textContent = "Could not squash: " + err.message;
      setStatus(false, "could not squash: " + err.message);
    }
  }

  document.getElementById("squashRun").addEventListener("click", () => {
    const button = document.getElementById("squashRun");
    if (button.dataset.done === "true") { location.reload(); return; }
    const anchored = THREADS.filter(t => VALID_ANCHORS.has(anchorKey(t))).length;
    const warning =
      "Squash " + FIXUP_COUNT + " fixup(s) into " + FIXUP_TARGETS + " commit(s)?\n\n"
      + "Every commit in this range gets a new sha.\n"
      + anchored + " thread(s) will lose their anchor and move to the orphan section.\n"
      + "A backup branch is made first, so this can be undone.";
    if (window.confirm(warning)) runSquash(button, false);
  });

  document.getElementById("staleBuild").addEventListener("click", async () => {
    const btn = document.getElementById("staleBuild");
    btn.disabled = true;
    btn.textContent = "Rebuilding…";
    try {
      const res = await fetch("/rebuild", { method: "POST" });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || "HTTP " + res.status);
      location.reload();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = "Rebuild and reload";
      setStatus(false, "could not rebuild: " + err.message);
    }
  });

  const origSelect = select;
  select = function (i) {
    closeComposer();
    closeSide();
    origSelect(i);
    paintThreads();
    /* Two different scrolls. The chosen commit has to stay visible in a list that now
       scrolls on its own, and the pane has to come back into view when the choice was
       made from the bottom of a long branch. Guarded because the smoke DOM has neither. */
    const btn = (DATA.commits[i] || {})._btn;
    if (btn && typeof btn.scrollIntoView === "function") btn.scrollIntoView({ block: "nearest" });
    const pane = document.getElementById("pane");
    if (pane && typeof pane.scrollIntoView === "function") pane.scrollIntoView({ block: "start" });
  };

  refresh();
  setInterval(() => { if (!document.hidden) refresh(); }, 4000);

  document.addEventListener("keydown", e => {
    if (e.target.matches("input, textarea, summary")) return;
    if (e.key === "Escape" && sideKey) { e.preventDefault(); closeSide(); return; }
    if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); select(Math.min(selected + 1, DATA.commits.length - 1)); }
    if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); select(Math.max(selected - 1, 0)); }
  });
</script>
